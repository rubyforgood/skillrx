<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found (404 Not found)</title>
  <!-- Self-contained: an error page can't rely on the app's stylesheet. Colors are the SkillRx tokens
       (docs/design/design.md): neutral-50 page, brand-700 links, neutral-900 and -500 text. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 16px;
      background: #f8fafc; color: #0f172b; font: 16px/1.5 Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 28rem; text-align: center; }
    img { height: 56px; margin-bottom: 24px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.01em; }
    p { margin: 0; color: #45556c; }
    .code { margin-top: 16px; font-size: 13px; color: #62748e; }
    a { color: #044a72; font-weight: 600; text-underline-offset: 2px; }
    a:focus-visible { outline: 2px solid #055889; outline-offset: 2px; border-radius: 2px; }
    .home { display: inline-block; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <img src="/skill-icon.svg" alt="SkillRx">
    <div class="card">
      <h1>Page not found</h1>
      <p>The page you were looking for doesn't exist. It may have been moved or deleted, or the address may be mistyped.</p>
      <p class="code">Error 404 Not found</p>
    </div>
    <a class="home" href="/">Go to the SkillRx home page</a>
  </main>
</body>
</html>
